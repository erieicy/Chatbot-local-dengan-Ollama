<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>AI Chatbot Web</title>

        

</head>
<body>

<div class="chat-container">
    <div class="chat-header">Ollama AI Web Chat</div>
    <div class="chat-box" id="chatBox">
        <div class="msg bot">Halo! Ada yang bisa dibantu?</div>
    </div>
    <div class="input-area">
        <input type="text" id="userInput" placeholder="Ketik pesan di sini..." onkeypress="if(event.key==='Enter') sendMessage()">
        <button onclick="sendMessage()">Kirim</button>
    </div>
</div>

</body>
    <script src="script.js"></script>
</html>
