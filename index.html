<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chatbot Web</title>
    <style>
        * { box-sizing: border-box; font-family: Arial, sans-serif; }
        body { background: #1e1e2e; color: #fff; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .chat-container { width: 450px; height: 600px; background: #2b2b3b; display: flex; flex-direction: column; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 20px rgba(0,0,0,0.4); }
        .chat-header { background: #3b3b4f; padding: 15px; font-weight: bold; text-align: center; border-bottom: 1px solid #444; }
        .chat-box { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .msg { max-width: 80%; padding: 10px 14px; border-radius: 10px; line-height: 1.4; word-wrap: break-word; }
        .user { background: #007bff; align-self: flex-end; border-bottom-right-radius: 2px; }
        .bot { background: #44445a; align-self: flex-start; border-bottom-left-radius: 2px; }
        .input-area { display: flex; padding: 10px; background: #222230; gap: 8px; }
        input { flex: 1; padding: 10px; border-radius: 6px; border: none; background: #333345; color: #fff; outline: none; }
        button { padding: 10px 18px; border-radius: 6px; border: none; background: #007bff; color: #fff; cursor: pointer; font-weight: bold; }
        button:hover { background: #0056b3; }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="chat-header">Ollama AI Web Chat</div>
    <div class="chat-box" id="chatBox">
        <div class="msg bot">Halo! Ada yang bisa dibantu?</div>
    </div>
    <div class="input-area">
        <input type="text" id="userInput" placeholder="Ketik pesan di sini..." onkeypress="if(event.key==='Enter') sendMessage()">
        <button onclick="sendMessage()">Kirim</button>
    </div>
</div>

<script>
    let history = [];

    async function sendMessage() {
        const inputField = document.getElementById('userInput');
        const chatBox = document.getElementById('chatBox');
        const text = inputField.value.trim();

        if (!text) return;

        // Tampilkan pesan user di UI
        chatBox.innerHTML += `<div class="msg user">${text}</div>`;
        inputField.value = '';
        chatBox.scrollTop = chatBox.scrollHeight;

        // Indikator loading
        const loadingId = 'loading-' + Date.now();
        chatBox.innerHTML += `<div class="msg bot" id="${loadingId}"><i>Lagi mikir...</i></div>`;
        chatBox.scrollTop = chatBox.scrollHeight;

        try {
            // Request ke Backend FastAPI
            const res = await fetch('/api/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: text, history: history })
            });

            const data = await res.json();
            document.getElementById(loadingId).remove();

            if (res.ok) {
                // Tampilkan balasan AI
                chatBox.innerHTML += `<div class="msg bot">${data.reply}</div>`;
                
                // Simpan ke riwayat lokal browser
                history.push({ role: 'user', content: text });
                history.push({ role: 'assistant', content: data.reply });
            } else {
                chatBox.innerHTML += `<div class="msg bot">Error: ${data.detail}</div>`;
            }
        } catch (err) {
            document.getElementById(loadingId).remove();
            chatBox.innerHTML += `<div class="msg bot">Gagal terhubung ke server backend!</div>`;
        }

        chatBox.scrollTop = chatBox.scrollHeight;
    }
</script>

</body>
</html>
